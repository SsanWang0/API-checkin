name: DIAG
on: workflow_dispatch

jobs:
  diag:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: 探测 agentrouter 真实响应
        env:
          ACCTS: ${{ secrets.ANYROUTER_ACCOUNTS }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.error

          print("=== runner 出口 IP ===")
          for svc in ("https://api.ipify.org", "https://ifconfig.me/ip"):
              try:
                  print(svc, "->", urllib.request.urlopen(svc, timeout=15).read().decode().strip())
                  break
              except Exception as e:
                  print(svc, "失败:", e)

          accts = json.loads(os.environ["ACCTS"])
          a = accts[0]
          sess = a["cookies"]["session"]
          au = a.get("api_user", "")
          url = "https://agentrouter.org/api/user/self"
          print("=== 账号 ===", a.get("name"), "| provider =", a.get("provider"), "| api_user =", au)

          UA = ("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36")

          def probe(tag, cookie):
              print("\n--- " + tag + " ---")
              h = {"Accept": "application/json, text/plain, */*", "User-Agent": UA}
              if cookie:
                  h["Cookie"] = cookie
              if au:
                  h["new-api-user"] = str(au)
              req = urllib.request.Request(url, headers=h)
              try:
                  r = urllib.request.urlopen(req, timeout=30)
                  b = r.read()
                  print("status       =", r.status)
                  print("content-type =", r.headers.get("content-type"))
                  print("server       =", r.headers.get("server"))
                  print("len          =", len(b))
                  print("body[:300]   =", b[:300])
              except urllib.error.HTTPError as e:
                  print("HTTPError    =", e.code)
                  print("content-type =", e.headers.get("content-type"))
                  print("server       =", e.headers.get("server"))
                  print("body[:300]   =", e.read()[:300])
              except Exception as e:
                  print("异常         =", type(e).__name__, e)

          probe("带 session（模拟签到请求）", "session=" + sess)
          probe("不带 session（对照组）", None)
          probe("带 session + 浏览器 UA 系列头", "session=" + sess)
          PYEOF
